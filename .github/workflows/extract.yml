name: Extract codex-android.zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip contents to repo root
        run: |
          unzip -o codex-android.zip
          rsync -a codex-android/ ./
          rm -rf codex-android codex-android.zip .github/workflows/extract.yml
          find . -path ./.git -prune -o -type f -print | sort
      - name: Show android workflow file
        run: cat .github/workflows/android.yml
      - name: Commit extracted files except the workflow file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q HEAD -- .github/workflows/android.yml
          git status --short
          git commit -m "Upload Codex Android source to repo root" || echo "Nothing to commit"
          git push
